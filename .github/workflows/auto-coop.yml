name: War Soul Auto Co-op

on:
  schedule: # 每 6 小时执行一次
    - cron: "0 */6 * * *"
  workflow_dispatch: # 允许手动触发

jobs:
  auto-coop:
    # 【修复1】将 ubuntu-latest 锁定为 ubuntu-22.04，彻底解决 Ubuntu 24/26 不支持的报错
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          # 【修复2】将 Windows 路径修改为 Linux 标准缓存路径
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: |
          # 【修复3】添加 --with-deps，自动安装 Chromium 运行所需的底层系统依赖
          npx playwright install --with-deps chromium

      - name: Run worker script
        # 【优化】移除了 shell: pwsh，在 Linux 下直接使用默认的 bash 运行 Node.js 效率更高且不易出错
        env:
          WARSOUL_USERNAME: ${{ secrets.WARSOUL_USERNAME }}
          WARSOUL_PASSWORD: ${{ secrets.WARSOUL_PASSWORD }}
          WARSOUL_MODE: ${{ secrets.WARSOUL_MODE }}
        run: node index.js

      - name: Upload artifacts (Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            status*.png
            error*.png

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04 # 【优化】保持环境一致性，同样锁定为 22.04
    permissions:
      actions: write
    steps:
      - name: Keep workflow alive
        uses: liskin/gh-workflow-keepalive@v1
